[package]
name         = "skill-studio"
edition      = { workspace = true }
rust-version = { workspace = true }
version      = { workspace = true }
license      = { workspace = true }
description  = "Agent Skill manager for Claude Code, Codex and more"
default-run  = "skill-studio"

[lib]
name       = "skill_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
doctest    = false

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0.8", features = ["build"] }

[dependencies]
skill-studio-mcp = { path = "../crates/mcp" }
skill-studio-service = { path = "../crates/service" }
skill-studio-core = { path = "../crates/core" }

tauri      = { version = "2.8.2", features = ["protocol-asset", "image-png", "macos-private-api"] }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
anyhow     = { workspace = true }
log        = { workspace = true }
dirs       = { workspace = true }
tokio      = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
notify     = "6"
uuid       = { version = "1.11", features = ["v4"] }
glob = "0.3"
sha2.workspace = true
tempfile.workspace = true

tauri-plugin-log          = "2"
tauri-plugin-dialog       = "2"
tauri-plugin-opener       = "2"
tauri-plugin-process      = "2"
tauri-plugin-window-state = "2"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "0.8"
objc2         = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSColor"] }

[dev-dependencies]
tempfile    = { workspace = true }
serial_test = "3"

[target.'cfg(unix)'.dev-dependencies]
tauri = { version = "2.8.2", features = ["test"] }
