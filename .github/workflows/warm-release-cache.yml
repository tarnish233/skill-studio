name: Warm release cache

# Release 构建最贵的是第三方依赖。标签之间不能共享 Actions 缓存，但标签可以
# 恢复主分支缓存，所以在主分支的依赖清单变化时先编一遍 Release 依赖。
# Windows 与 macOS 并行预热，两者都只编译、不打包、不发布。
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - Cargo.toml
      - crates/**/Cargo.toml
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
      - rust-toolchain.toml
      - .github/workflows/warm-release-cache.yml

permissions:
  contents: read

concurrency:
  group: warm-release-cache
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # 与 release.yml 共用 shared-key，并使用相同的代码生成单元数，
          # 这样依赖指纹一致，标签构建可直接复用。
          shared-key: release
          cache-on-failure: true
          workspaces: . -> target
      # tauri-build 要求 frontendDist 存在；预热只编 Rust，不跑前端构建。
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>cache</title>' > dist/index.html
      - name: Compile release dependencies
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"
        run: cargo build --release --locked -p skill-studio --lib

  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify Apple Silicon runner and select Xcode
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Install pinned Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # 与 release.yml 的 Apple Silicon 构建共用缓存。
          shared-key: release
          cache-on-failure: true
          workspaces: . -> target
      - name: Stub frontend dist
        shell: bash
        run: mkdir -p dist && echo '<!doctype html><title>cache</title>' > dist/index.html
      - name: Compile release dependencies
        env:
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
        run: cargo build --release --locked --target aarch64-apple-darwin -p skill-studio --lib
