name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version, main ancestry and successful CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py verify --tag "$GITHUB_REF_NAME"
          RELEASE_SHA=$(git rev-parse HEAD)
          # Allow retrying a successful main commit after main advances.
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python scripts/release.py ci-gate --sha "$RELEASE_SHA"

  remote-helper:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Linux remote helpers
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked -p skill-studio-remote
          cargo build --release --locked -p skill-studio-remote --target aarch64-unknown-linux-gnu
          mkdir -p remote-helpers
          cp target/release/skill-studio-remote remote-helpers/skill-studio-remote-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/skill-studio-remote remote-helpers/skill-studio-remote-linux-aarch64
          file remote-helpers/*
      - uses: actions/upload-artifact@v4
        with:
          name: remote-helper-binaries
          path: remote-helpers/*
          if-no-files-found: error

  build:
    needs: [gate, remote-helper]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 出 universal 包，一份同时支持 Apple Silicon 与 Intel
          - os: macos-15
            label: macOS
            args: "--target universal-apple-darwin"
            rust-targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - os: ubuntu-22.04
            label: Linux
            args: "--bundles appimage,deb"
            rust-targets: ""
          - os: windows-latest
            label: Windows
            args: "--bundles msi,nsis"
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with the Liquid Glass SDK
        if: runner.os == 'macOS'
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          rustup show
          if [[ -n "$RUST_TARGETS" ]]; then
            IFS=',' read -ra targets <<< "$RUST_TARGETS"
            rustup target add "${targets[@]}"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: remote-helper-binaries
          path: src-tauri/resources/remote

      - name: Build
        run: pnpm exec tauri build ${{ matrix.args }}

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 各平台产物路径不同，统一捞到一个目录里
          find target -type f \
            \( -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" \
               -o -name "*.msi" -o -name "*-setup.exe" \) \
            -exec cp {} dist-artifacts/ \;
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: skill-studio-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: skill-studio-*
          path: artifacts
      - name: Verify packages, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish-assets artifacts

  update-homebrew:
    needs: release
    uses: ./.github/workflows/update-homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
