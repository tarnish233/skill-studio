name: Release

on:
  push:
    tags: ["v*"]
  # 手动基准：只构建三端并上传临时 artifact，不创建 Release、不更新 Homebrew。
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify version, main ancestry and successful CI for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py verify --tag "$GITHUB_REF_NAME"
          RELEASE_SHA=$(git rev-parse HEAD)
          # Allow retrying a successful main commit after main advances.
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          python scripts/release.py ci-gate --sha "$RELEASE_SHA"
      # 基准构建不发布，只校验仓库版本一致；不要求版本标签。
      - name: Verify version for a benchmark build
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/release.py verify

  remote-helper:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup show
          rustup target add aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Install ARM64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build Linux remote helpers
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --locked -p skill-studio-remote
          cargo build --release --locked -p skill-studio-remote --target aarch64-unknown-linux-gnu
          mkdir -p remote-helpers
          cp target/release/skill-studio-remote remote-helpers/skill-studio-remote-linux-x86_64
          cp target/aarch64-unknown-linux-gnu/release/skill-studio-remote remote-helpers/skill-studio-remote-linux-aarch64
          file remote-helpers/*
      - uses: actions/upload-artifact@v4
        with:
          name: remote-helper-binaries
          path: remote-helpers/*
          if-no-files-found: error

  build:
    needs: [gate, remote-helper]
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 仅构建 Apple Silicon；不再编译 Intel 或合成 Universal 包
          - os: macos-15
            label: macOS
            args: "--target aarch64-apple-darwin"
            rust-targets: "aarch64-apple-darwin"
            codegen-units: "8"
          - os: ubuntu-22.04
            label: Linux
            args: "--bundles appimage,deb"
            rust-targets: ""
            codegen-units: "8"
          - os: windows-latest
            label: Windows
            args: "--bundles msi,nsis"
            rust-targets: ""
            # Windows 的依赖编译和最终链接占 Release 的大头；16 个代码生成单元
            # 配合 ThinLTO，进一步并行代码生成，仍保留跨单元优化。
            codegen-units: "16"
    runs-on: ${{ matrix.os }}
    # 放到 job 级，rust-cache 才能把代码生成单元数计入缓存键。
    env:
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ matrix.codegen-units }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Apple Silicon runner and select Xcode
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install pinned Rust toolchain
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust-targets }}
        run: |
          rustup show
          if [[ -n "$RUST_TARGETS" ]]; then
            IFS=',' read -ra targets <<< "$RUST_TARGETS"
            rustup target add "${targets[@]}"
          fi

      - uses: Swatinem/rust-cache@v2
        with:
          # 与主分支的预热任务共用缓存；标签之间不能互相恢复缓存，
          # 因此标签构建只恢复、不保存，避免占满缓存配额。
          shared-key: release
          save-if: false
          workspaces: . -> target

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libglib2.0-dev libgtk-3-dev

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: remote-helper-binaries
          path: src-tauri/resources/remote

      - name: Build
        run: pnpm exec tauri build ${{ matrix.args }}

      # 桌面和随包 CLI 均只包含 arm64；保留架构与命令行运行检查
      - name: Verify bundled Apple Silicon binaries
        if: runner.os == 'macOS'
        run: |
          app="target/aarch64-apple-darwin/release/bundle/macos/Skill Studio.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          cli="$app/Contents/MacOS/skill-studio-cli"
          for binary in "$app/Contents/MacOS/$executable" "$cli"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            [[ "$archs" == arm64 ]]
          done
          "$cli" --version

      - name: Verify the command line is inside the Linux packages
        if: runner.os == 'Linux'
        run: |
          test -x target/release/skill-studio-cli
          target/release/skill-studio-cli --version
          deb="$(ls target/release/bundle/deb/*.deb | head -n 1)"
          dpkg-deb -c "$deb" | grep -E 'usr/bin/skill-studio-cli$'

      - name: Verify the command line is inside the Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = "target/release/skill-studio-cli.exe"
          if (-not (Test-Path $cli)) { throw "命令行程序没有编出来" }
          & $cli --version
          $msi = Get-ChildItem "target/release/bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "没有找到 msi" }
          # 路径里有空格，先复制到无空格的临时位置再解包
          Copy-Item $msi.FullName "$env:RUNNER_TEMP/ss.msi"
          $out = Join-Path $env:RUNNER_TEMP "ss-msi"
          $p = Start-Process msiexec.exe -ArgumentList "/a", "$env:RUNNER_TEMP\ss.msi", "/qn", "TARGETDIR=$out" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "解包 msi 失败：$($p.ExitCode)" }
          $found = Get-ChildItem $out -Recurse -Filter skill-studio-cli.exe
          if (-not $found) { throw "msi 里没有 skill-studio-cli.exe" }
          Write-Host "msi 里找到：$($found.FullName)"

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist-artifacts
          # 用 package.json 的实际版本；标签名在手动基准时是 main。
          version="$(python3 -c 'import json; print(json.load(open("package.json"))["version"])')"
          if [[ "$RUNNER_OS" == macOS ]]; then
            # 只收集当前版本的 ARM64 包，避免缓存中的旧 Universal 产物混入发布
            find target/aarch64-apple-darwin/release/bundle -type f \
              -name "*_${version}_aarch64.dmg" \
              -exec cp {} dist-artifacts/ \;
          else
            find target -type f \
              \( -name "*.AppImage" -o -name "*.deb" \
                 -o -name "*.msi" -o -name "*-setup.exe" \) \
              -exec cp {} dist-artifacts/ \;
          fi
          ls -la dist-artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: skill-studio-${{ matrix.label }}
          path: dist-artifacts/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: skill-studio-*
          path: artifacts
      - name: Verify packages, upload draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release.py publish-assets artifacts

  update-homebrew:
    needs: release
    uses: ./.github/workflows/update-homebrew.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
