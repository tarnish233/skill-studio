name: Update Homebrew tap

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out release tooling
        uses: actions/checkout@v4
        with:
          path: release-tooling
      - name: Check out Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: tarnish233/homebrew-tap
          ref: main
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test updater
        run: python -m unittest discover -s release-tooling/scripts -p 'test_release.py' -v
      - name: Verify release asset and update Cask
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python release-tooling/scripts/release.py update-cask tap/Casks/skill-studio.rb --version "${RELEASE_TAG#v}"
      - name: Validate and push update
        working-directory: tap
        run: |
          ruby -c Casks/skill-studio.rb
          git diff --check
          if git diff --quiet -- Casks/skill-studio.rb; then
            echo "Cask is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/skill-studio.rb
          git commit -m "chore: update Skill Studio cask"
          git push origin HEAD:main
