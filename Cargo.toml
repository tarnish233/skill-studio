[workspace]
members  = ["crates/core", "crates/mcp", "crates/remote-helper", "crates/service", "src-tauri"]
resolver = "2"

[workspace.package]
edition      = "2021"
rust-version = "1.88"
version      = "0.5.4"
license      = "MIT"

[workspace.dependencies]
serde      = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror  = "2.0"
anyhow     = "1.0"
dirs       = "5.0"
sha2       = "0.10"
log        = "0.4"
chrono     = { version = "0.4", features = ["serde"] }
indexmap   = { version = "2", features = ["serde"] }
once_cell  = "1.21"
toml_edit  = "0.22"
tempfile   = "3"

[profile.release]
codegen-units = 1
lto           = "thin"
opt-level     = "s"
panic         = "unwind"
strip         = "debuginfo"

# 构建脚本与 proc-macro 必须单独放行。
# 它们在 macOS 上是要被 dyld 加载的 .dylib，一旦被 strip，新版 Apple 链接器会产出
# mis-aligned LINKEDIT string pool，加载直接失败，表现为编译期报
# "can't find crate for xxx_derive"。debug 构建不 strip，所以只在 release 暴露。
# 顺带一个好处：proc-macro 不做优化，编译快很多。
# 注：lto 不能写在 build-override 里，Cargo 说它对 proc-macro 本就不生效。
[profile.release.build-override]
opt-level     = 0
codegen-units = 16
strip         = "none"
debug         = false
