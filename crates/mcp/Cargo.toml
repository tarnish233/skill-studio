[package]
name = "skill-studio-mcp"
version.workspace = true
edition.workspace = true
rust-version = "1.88"
license.workspace = true

[dependencies]
skill-studio-core = { path = "../core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml_edit = { workspace = true, features = ["serde"] }
sha2.workspace = true
fs2 = "0.4.3"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "query"] }
rmcp = { version = "=3.4.0", default-features = false, features = ["client", "server", "auth", "reqwest", "transport-child-process", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
async-trait = "0.1"
process-wrap = { version = "10", features = ["tokio1"] }
shlex = "2.0"
jsonc-parser = { version = "0.33.2", features = ["cst", "serde"] }

[dev-dependencies]
tempfile.workspace = true
